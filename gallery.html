<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<h2>Gallery</h2>


<div class="tabs">
  <button onclick="showTab(event, 'images')" class="active">Images</button>
  <button onclick="showTab(event, 'videos')">Videos</button>
</div>
<!-- IMAGES TAB -->
<div id="images" class="gallery active">

  <img
    src="https://picsum.photos/id/1015/600/400"
    loading="lazy"
    alt="Image 1"
    onclick="openImageLightbox(this.src)">

  <img
    src="https://picsum.photos/id/1025/600/400"
    loading="lazy"
    alt="Image 2"
    onclick="openImageLightbox(this.src)">

</div>

<!-- VIDEOS -->
<div id="videos" class="gallery">

  <div class="media youtube" data-type="youtube" data-src="E4c_vIwanEA">
  <div class="thumb">
    ▶ YouTube Video
  </div>
  </div>

  <div class="media" data-type="mp4" data-src="media/InfamousQuotefromAffliction.mp4">
  <video preload="none" muted playsinline pointer-events="none">
    <source src="media/InfamousQuotefromAffliction.mp4" type="video/mp4">
  </video>
  </div>

</div>

<!-- VIDEO LIGHTBOX -->
<div id="videoLightbox">
  <div class="lightbox-inner"></div>
</div>

<!-- IMAGE LIGHTBOX -->
<div id="imageLightbox" onclick="closeImageLightbox()">
  <img id="imageLightboxImg">
</div>

<script src="js/gallery.js"></script>
</body>
</html>
